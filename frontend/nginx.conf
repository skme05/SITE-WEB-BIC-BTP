upstream django {
    server backend:8000;
}

# Conserve le schéma (https) et l'IP client transmis par le Nginx du serveur
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_real_ip $client_real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # API, admin et fichiers statiques Django -> backend
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Fichiers uploadés (volume partagé avec le backend)
    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }

    # Assets Vite (noms hashés) -> cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
