# Nginx du SERVEUR (hors Docker) — BIC BTP
#
# À copier dans /etc/nginx/sites-available/bicbtp puis activer :
#   sudo ln -s /etc/nginx/sites-available/bicbtp /etc/nginx/sites-enabled/
#
# Ce fichier ne contient volontairement que le bloc HTTP (port 80) :
# `certbot --nginx` ajoute automatiquement le bloc HTTPS (443), le certificat
# et la redirection HTTP -> HTTPS.
#
# Le conteneur `frontend` écoute sur 127.0.0.1:8080 (HTTP_PORT dans .env).

server {
    listen 80;
    listen [::]:80;
    server_name bicbtp.ci www.bicbtp.ci;

    # Doit être >= à celui du conteneur (uploads via l'admin)
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
